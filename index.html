<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Café LIV Mürren — Coffee, Cakes &amp; Alpine Views in the Swiss Alps</title>
    <meta name="description" content="Café LIV is a cozy café in Mürren, Switzerland, offering great coffee, fresh cakes, light meals and vegan options with stunning Swiss Alps views. Rated 4.7★ on Google with 637+ reviews." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Canonical URL — replace YOUR-DOMAIN.com with the real domain after deployment -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="Café LIV Mürren" />
    <meta property="og:title" content="Café LIV Mürren — Coffee, Cakes &amp; Alpine Views" />
    <meta property="og:description" content="A cozy café in the heart of Mürren, Switzerland. Great coffee, fresh cakes, vegan options and spectacular Swiss Alps views. Rated 4.7★ on Google." />
    <!-- og:image — replace with the real deployed image URL, ideally 1200×630px -->
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Café LIV outdoor terrace with food and Swiss Alps backdrop, Mürren Switzerland" />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Café LIV Mürren — Coffee, Cakes &amp; Alpine Views" />
    <meta name="twitter:description" content="A cozy café in the heart of Mürren, Switzerland. Great coffee, fresh cakes, vegan options and spectacular Swiss Alps views. Rated 4.7★ on Google." />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Café LIV outdoor terrace with food and Swiss Alps backdrop, Mürren Switzerland" />

    <!-- Geo / Local -->
    <meta name="geo.region" content="CH-BE" />
    <meta name="geo.placename" content="Mürren, Switzerland" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CafeOrCoffeeShop",
      "name": "Café LIV",
      "description": "A cozy café in Mürren, Switzerland offering great coffee, fresh cakes, light meals and vegan options with stunning Swiss Alps views.",
      "url": "https://YOUR-DOMAIN.com/",
      "telephone": "+41762137305",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Bir Schiir 1056",
        "addressLocality": "Mürren",
        "postalCode": "3825",
        "addressCountry": "CH"
      },
      "servesCuisine": ["Swiss", "Café", "Vegetarian", "Vegan"],
      "priceRange": "CHF 10–20",
      "currenciesAccepted": "CHF",
      "paymentAccepted": "Cash, Credit Card",
      "hasMenu": "https://YOUR-DOMAIN.com/#menu",
      "sameAs": [
        "https://www.instagram.com/cafeliv_muerren",
        "https://www.google.com/maps/place/Bir+Schiir+1056,+3825+M%C3%BCrren,+Switzerland"
      ],
      "image": "https://YOUR-DOMAIN.com/og-image.jpg",
      "openingHours": "PLACEHOLDER — add verified opening hours before publishing",
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Outdoor Seating", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Takeaway", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Vegan Options", "value": true }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
